name: CI

on:
  push:
    branches:
      - main
  pull_request:

env:
  HOMEBREW_DEVELOPER: 1
  HOMEBREW_GITHUB_ACTIONS: 1
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_CHANGE_ARCH_TO_ARM: 1

concurrency:
  group: "tests-${{ github.ref }}"
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  brew-test-bot:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-15, macos-26]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@main

      - name: Run Homebrew tests
        run: brew test-bot

      # test-bot ignores build failures for formulae without bottles (all of this tap's),
      # so fail the job if it reports any formula as skipped or failed.
      - name: Check all formulae built
        if: always()
        run: |
          shopt -s nullglob
          files=(skipped_or_failed_formulae-*.txt)
          failed=$(cat /dev/null "${files[@]}")
          if [ -n "$failed" ]; then
            echo "::error::Skipped or failed formulae: $failed"
            exit 1
          fi
